<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
    <h1 style="color:aquamarine; margin-right:30px;">Welcome to the food spot</h1>
    </div>

    <div class="food-card">
        <img src="https://as2.ftcdn.net/v2/jpg/02/84/46/89/1000_F_284468940_1bg6BwgOfjCnE3W0wkMVMVqddJgtMynE.jpg" alt="Food Image">

        <div class="card-content">

            <div class="tags">
                <span class="tag">🍕 Pizza</span>
                <span class="tag">⭐ 4.8</span>
                <span class="tag">⏱ 20 min</span>
            </div>

            <h2 class="food-title">Margherita Pizza</h2>

            <p class="food-description">
                Fresh mozzarella cheese, basil leaves, rich tomato sauce,
                and a crispy baked crust served hot.
            </p>

            <div class="card-footer">
                <span class="price">$14.99</span>
                <button>Order Now</button>
            </div>

        </div>
    </div>

</body>
</html>
